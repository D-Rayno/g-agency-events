# ============================================
# Docker Compose - Development Environment
# ============================================
# Purpose: Local development with hot-reloading via bind mounts
# Features: Direct port access, bind mounts, development target
# Usage: make dev-up
# ============================================

services:
  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: zevent-dev-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-events_platform}
      MYSQL_USER: ${DB_USER:-g_agency}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecurePass2024_GAgency!}
    ports:
      - "${DB_PORT:-3307}:3306" # Exposed for local database clients
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - dev-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USER:-g_agency}",
          "-p${DB_PASSWORD:-SecurePass2024_GAgency!}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Typesense Search Engine
  # ============================================
  typesense:
    build:
      context: .
      dockerfile: Dockerfile.typesense
    image: zevent-dev-typesense
    restart: unless-stopped
    container_name: zevent-dev-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev_typesense_key}
    ports:
      - "${TYPESENSE_PORT:-8109}:8108" # Exposed for direct API testing
    volumes:
      - typesense_dev_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      --data-dir /data 
      --api-key=${TYPESENSE_API_KEY:-dev_typesense_key}
      --enable-cors

  # ============================================
  # AdonisJS Application (Development Mode)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development # Use development stage with all dev dependencies
      args:
        NODE_ENV: development
    container_name: zevent-dev-app
    restart: unless-stopped
    environment:
      # Core settings
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}

      # Database
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-events_user}
      DB_PASSWORD: ${DB_PASSWORD:-events_password}
      DB_DATABASE: ${DB_DATABASE:-events_platform}

      # Typesense
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-true}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev_typesense_key}

      # Session & Auth
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Security
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}

      # Firebase
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}

      # Mail (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dev Events Platform}

      # Storage
      DRIVE_DISK: ${DRIVE_DISK:-fs}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    ports:
      - "${PORT:-3333}:3333" # Exposed for direct access and debugging

    volumes:
      # BIND MOUNT: Source code for hot-reloading
      - ./:/app
      # Named volume for node_modules to prevent host/container conflicts
      - node_modules_dev:/app/node_modules
      # Persistent directories
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs

    networks:
      - dev-network

    depends_on:
      db:
        condition: service_healthy
      typesense:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Nginx Reverse Proxy (Development)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: zevent-dev-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/app/public/uploads:ro
      - nginx_dev_logs:/var/log/nginx
    networks:
      - dev-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ============================================
# Networks
# ============================================
networks:
  dev-network:
    driver: bridge
    name: zevent-dev-network

# ============================================
# Volumes
# ============================================
volumes:
  mysql_dev_data:
    name: zevent-dev-mysql-data
  typesense_dev_data:
    name: zevent-dev-typesense-data
  node_modules_dev:
    name: zevent-dev-node-modules
  nginx_dev_logs:
    name: zevent-dev-nginx-logs
