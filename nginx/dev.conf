# ============================================
# Nginx Configuration - Development Environment
# ============================================
# Purpose: Development-focused proxy with detailed logging and no caching
# Features: Verbose logs, no caching, permissive CORS, WebSocket support
# ============================================

# Upstream for AdonisJS app
upstream app_backend {
    server app:3333 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Large buffer sizes for development (testing large uploads)
    client_body_buffer_size 256k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 32k;
    client_max_body_size 200M; # Allow large file uploads in dev

    # Root directory for static files
    root /app/public;

    # Detailed logging for debugging
    access_log /var/log/nginx/dev_access.log combined;
    error_log /var/log/nginx/dev_error.log debug;

    # Development CORS headers (permissive)
    # Using 'always' ensures these headers are included in all responses, including error responses and OPTIONS
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;


    # Health check endpoint (no logging)
    location /health {
        proxy_pass http://app_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Serve uploaded files directly (no caching in dev)
    location /uploads/ {
        alias /app/public/uploads/;
        # No caching in development for immediate feedback
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve static assets (no caching in dev)
    location /assets/ {
        proxy_pass http://app_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # No caching in development
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # WebSocket support for Hot Module Reloading (HMR)
    location /ws {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # 24 hours for long-lived connections
        proxy_cache_bypass 1;
    }

    # Vite HMR WebSocket (if using Vite dev server)
    location /@vite/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass 1;
    }

    # Proxy all other requests to AdonisJS
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No caching for dynamic content in development
        proxy_cache_bypass 1;
        proxy_no_cache 1;

        # Generous timeouts for debugging
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }

    # Deny access to sensitive hidden files (e.g., .git, .env, .htaccess)
    # Only blocks files/directories that START with a dot, not paths containing /.
    location ~ /\.(git|svn|htaccess|htpasswd|env) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
